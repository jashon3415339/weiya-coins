<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7a0d12">
<title>全場手機賽馬 🏇</title>
<style>
  :root{
    --bg1:#7a0d12; --bg2:#2b0306; --gold:#ffd25e; --gold2:#f0a500;
    --text:#fff8ec; --muted:rgba(255,248,236,.7); --dept:#ffd25e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;
    color:var(--text);
    background:radial-gradient(circle at 50% 0%, #b3171f 0%, var(--bg1) 40%, var(--bg2) 100%);
    position:fixed; inset:0;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  .page{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
        padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px)}
  .page.active{display:flex}
  h1{font-size:28px;margin:0 0 6px;text-align:center;letter-spacing:1px}
  .sub{color:var(--muted);text-align:center;margin:0 0 28px;font-size:15px;line-height:1.5}
  .btn{
    display:block;width:100%;max-width:420px;margin:8px 0;padding:18px 16px;border:none;border-radius:16px;
    font-size:22px;font-weight:700;color:#3a0a00;background:linear-gradient(180deg,var(--gold),var(--gold2));
    box-shadow:0 4px 0 #a86e00, 0 8px 18px rgba(0,0,0,.35);font-family:inherit;cursor:pointer
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86e00}
  .btn small{display:block;font-size:13px;font-weight:500;opacity:.75;margin-top:2px}
  .deptGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
  .deptBtn{padding:20px 8px;border-radius:16px;border:3px solid rgba(255,255,255,.2);color:#fff;font-size:20px;
           font-weight:800;font-family:inherit;text-shadow:0 1px 3px rgba(0,0,0,.4);box-shadow:0 6px 14px rgba(0,0,0,.3)}
  .deptBtn:active{transform:scale(.96)}
  .nameBox{width:100%;max-width:440px;margin:0 0 18px}
  .nameBox label{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
  #nameInput{width:100%;font-size:22px;padding:14px 16px;border-radius:14px;border:3px solid var(--gold);background:#fff8ec;color:#3a0a00;font-family:inherit;-webkit-user-select:text;user-select:text}
  #nameInput.err{border-color:#ff5252;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .link{background:none;border:none;color:var(--muted);font-size:15px;margin-top:22px;text-decoration:underline;font-family:inherit}

  /* play page */
  #pPlay{justify-content:flex-start;padding-left:14px;padding-right:14px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
  .chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.28);font-weight:700;font-size:16px}
  #myDept{max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--dept);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
  .net{width:10px;height:10px;border-radius:50%;background:#3ddc84;margin-left:6px}
  .net.bad{background:#ff5252;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .smallBtn{background:rgba(0,0,0,.28);border:none;color:var(--text);padding:8px 12px;border-radius:999px;font-size:14px;font-family:inherit}
  .status{margin:14px 0 6px;font-size:22px;font-weight:700;text-align:center;min-height:30px}
  .timer{font-size:64px;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35);min-height:64px}
  .tapWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:14px 0}
  #tap{
    width:min(84vw,62vh);height:min(84vw,62vh);border-radius:50%;border:none;font-family:inherit;
    background:radial-gradient(circle at 35% 30%, #fff3c4 0%, var(--gold) 35%, var(--gold2) 100%);
    color:#5a1500;font-size:clamp(34px,11vw,64px);font-weight:900;
    box-shadow:0 10px 0 #a86e00, 0 18px 40px rgba(0,0,0,.45), inset 0 -8px 18px rgba(0,0,0,.15);
    display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;
    transition:transform .05s
  }
  #tap .cnt{font-size:.55em;margin-top:6px;opacity:.85}
  #tap.disabled{filter:grayscale(.9) brightness(.6);box-shadow:0 6px 0 #555, 0 12px 30px rgba(0,0,0,.4)}
  #tap.disabled .label{font-size:.42em;padding:0 12%;line-height:1.3}
  #tap.hit{transform:scale(.94) translateY(6px);box-shadow:0 4px 0 #a86e00, 0 8px 20px rgba(0,0,0,.4)}
  .mycount{font-size:20px;color:var(--muted);text-align:center;min-height:28px}
  .warn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);
        background:rgba(0,0,0,.65);padding:8px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .warn.show{opacity:1}
  .demo{position:fixed;top:4px;left:50%;transform:translateX(-50%);font-size:11px;background:#000a;padding:2px 8px;border-radius:6px;display:none}
</style>
</head>
<body>
<div class="demo" id="demoTag">DEMO 單機試玩模式</div>

<!-- Page 1: language -->
<section class="page active" id="pLang">
  <div style="font-size:64px" id="gEmoji">🏇</div>
  <h1 id="gTitle">全場手機賽馬</h1>
  <p class="sub" id="gSub">Phone Horse Race · Đua ngựa điện thoại</p>
  <button class="btn" data-lang="zh">中文</button>
  <button class="btn" data-lang="en">English</button>
  <button class="btn" data-lang="vi">Tiếng Việt</button>
</section>

<!-- Page 2: department -->
<section class="page" id="pDept">
  <div class="nameBox">
    <label for="nameInput" data-t="yourName"></label>
    <input id="nameInput" maxlength="20" autocomplete="off" enterkeyhint="done">
  </div>
  <h1 data-t="chooseDept"></h1>
  <p class="sub" data-t="chooseDeptSub"></p>
  <div class="deptGrid" id="deptGrid"></div>
  <button class="link" id="backLang" data-t="changeLang"></button>
</section>

<!-- Page 3: play -->
<section class="page" id="pPlay">
  <div class="topbar">
    <div class="chip"><span class="dot"></span><span id="myDept"></span><span class="net" id="net"></span></div>
    <button class="smallBtn" id="changeDept" data-t="changeDept"></button>
  </div>
  <div class="status" id="status"></div>
  <div class="timer" id="timer"></div>
  <div class="tapWrap">
    <button id="tap" class="disabled"><span class="label" id="tapLabel"></span><span class="cnt" id="tapCnt"></span></button>
  </div>
  <div class="mycount" id="mycount"></div>
</section>

<div class="warn" id="warn"></div>

<script src="config.js"></script>
<script>
(function(){
  'use strict';
  var CFG = window.GAME_CONFIG;
  var DEMO = /PASTE_/.test(CFG.firebase.apiKey) || /[?&]demo=1/.test(location.search);
  if (DEMO) document.getElementById('demoTag').style.display = 'block';
  if (CFG.theme !== 'horse') {
    document.title = '財神撒金幣 💰';
    document.getElementById('gEmoji').textContent = '💰';
    document.getElementById('gTitle').textContent = '財神撒金幣';
    document.getElementById('gSub').textContent = 'Coin Rush · Thần Tài rải vàng';
  }

  // ---------------- i18n ----------------
  var T = {
    zh:{yourName:'你的名字',namePh:'例如：王小明',needName:'請先輸入名字',chooseDept:'選擇你的部門',chooseDeptSub:'幫自己的部門衝第一！',changeLang:'更換語言',changeDept:'更換部門',
        waiting:'等待主持人開始…',waitingBtn:'等待主持人開始',getReady:'準備！',tap:'狂點！',timeLeft:'剩餘秒數',
        timeUp:'時間到！',seeScreen:'看大螢幕公布冠軍 🏆',youTapped:'你點了 {n} 下',tooFast:'太快了！超過的不算喔',
        netBad:'網路不穩，重試中…',roundOver:'本局已結束，等待下一局',locked:'比賽中不能更換部門'},
    en:{yourName:'Your name',namePh:'e.g. Alex Wang',needName:'Please enter your name first',chooseDept:'Choose your department',chooseDeptSub:'Tap to help your team win!',changeLang:'Change language',changeDept:'Change dept.',
        waiting:'Waiting for the host to start…',waitingBtn:'Waiting for the host',getReady:'Get ready!',tap:'TAP!',timeLeft:'Seconds left',
        timeUp:'Time’s up!',seeScreen:'Watch the big screen for the winner 🏆',youTapped:'You tapped {n} times',tooFast:'Too fast! Extra taps don’t count',
        netBad:'Network unstable, retrying…',roundOver:'Round over — waiting for the next one',locked:'Can’t change department during the race'},
    vi:{yourName:'Tên của bạn',namePh:'Ví dụ: Nguyễn Văn An',needName:'Vui lòng nhập tên trước',chooseDept:'Chọn bộ phận của bạn',chooseDeptSub:'Bấm thật nhanh để đội bạn thắng!',changeLang:'Đổi ngôn ngữ',changeDept:'Đổi bộ phận',
        waiting:'Đang chờ người dẫn chương trình bắt đầu…',waitingBtn:'Đang chờ bắt đầu',getReady:'Chuẩn bị!',tap:'BẤM!',timeLeft:'Giây còn lại',
        timeUp:'Hết giờ!',seeScreen:'Xem màn hình lớn để biết đội vô địch 🏆',youTapped:'Bạn đã bấm {n} lần',tooFast:'Nhanh quá! Phần vượt không được tính',
        netBad:'Mạng không ổn định, đang thử lại…',roundOver:'Ván đã kết thúc — chờ ván tiếp theo',locked:'Không thể đổi bộ phận khi đang thi đấu'}
  };
  var LS = {
    get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  var lang = LS.get('hr_lang');
  var deptId = LS.get('hr_dept');
  var myName = LS.get('hr_name') || '';
  function t(k,vars){var s=(T[lang]||T.zh)[k]||k; if(vars) for(var x in vars) s=s.replace('{'+x+'}',vars[x]); return s;}
  function deptById(id){for(var i=0;i<CFG.departments.length;i++) if(CFG.departments[i].id===id) return CFG.departments[i]; return null;}
  function deptName(d){return d ? (d[lang]||d.zh) : '';}

  // ---------------- device id ----------------
  var dev = LS.get('hr_dev');
  if (!dev || !/^[a-z0-9]{8,32}$/.test(dev)) {
    dev=''; var chars='abcdefghijklmnopqrstuvwxyz0123456789';
    for (var i=0;i<16;i++) dev += chars[Math.floor(Math.random()*chars.length)];
    LS.set('hr_dev', dev);
  }

  // ---------------- backend ----------------
  // Phones never open a realtime connection: plain REST requests only.
  var backend;
  if (!DEMO) {
    var base = CFG.firebase.databaseURL.replace(/\/+$/,'');
    var req = function(method, path, body){
      var opt = {method:method, cache:'no-store'};
      if (body !== undefined) { opt.body = JSON.stringify(body); }
      return fetch(base + path + '.json', opt).then(function(r){
        if (!r.ok) { var e = new Error('HTTP '+r.status); e.status = r.status; throw e; }
        return r.json();
      });
    };
    backend = {
      getGame:function(){ return req('GET','/game'); },
      ping:function(){ return req('PUT','/ping/'+dev, {'.sv':'timestamp'}); },
      putClicks:function(round, dept, c){ return req('PUT','/clicks/'+round+'/'+dept+'/'+dev, {c:c, n:myName, t:{'.sv':'timestamp'}}); }
    };
  } else {
    // Demo: shared localStorage between tabs in the same browser
    var delay = function(v){ return new Promise(function(res){ setTimeout(function(){res(v)}, 40); }); };
    var read = function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
    backend = {
      getGame:function(){ return delay(read('hr_demo_game')); },
      ping:function(){ return delay(Date.now()); },
      putClicks:function(round, dept, c){
        var g = read('hr_demo_game'), now = Date.now();
        if (!g || g.round!==round || g.state!=='running' || now < g.startAt || now > g.endsAt + 5000) {
          var e = new Error('denied'); e.status = 401; return Promise.reject(e);
        }
        var all = read('hr_demo_clicks') || {};
        all[round] = all[round] || {}; all[round][dept] = all[round][dept] || {};
        all[round][dept][dev] = {c:c, n:myName, t:now};
        localStorage.setItem('hr_demo_clicks', JSON.stringify(all));
        return delay({c:c, t:now});
      }
    };
  }

  // ---------------- clock sync ----------------
  var offset = 0; // serverTime - localTime
  function serverNow(){ return Date.now() + offset; }
  function syncClock(){
    var t0 = Date.now();
    return backend.ping().then(function(ts){
      var t1 = Date.now();
      if (typeof ts === 'number') offset = ts - (t0 + t1)/2;
    }).catch(function(){});
  }

  // ---------------- pages ----------------
  function show(id){
    var ps = document.querySelectorAll('.page');
    for (var i=0;i<ps.length;i++) ps[i].classList.toggle('active', ps[i].id===id);
    applyTexts();
  }
  function applyTexts(){
    var els = document.querySelectorAll('[data-t]');
    for (var i=0;i<els.length;i++) els[i].textContent = t(els[i].getAttribute('data-t'));
    var ni = document.getElementById('nameInput'); ni.placeholder = t('namePh'); if (!ni.value) ni.value = myName;
    document.documentElement.lang = lang==='en'?'en':lang==='vi'?'vi':'zh-Hant';
  }
  function buildDepts(){
    var g = document.getElementById('deptGrid'); g.innerHTML='';
    CFG.departments.forEach(function(d){
      var b = document.createElement('button');
      b.className='deptBtn'; b.style.background=d.color; b.textContent=deptName(d);
      b.onclick=function(){
        var inp = document.getElementById('nameInput');
        var nm = inp.value.replace(/\s+/g,' ').trim().slice(0,20);
        if (!nm) { inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err'); inp.focus(); flash(t('needName')); return; }
        myName = nm; LS.set('hr_name', nm); inp.blur();
        deptId=d.id; LS.set('hr_dept',deptId); enterPlay();
      };
      g.appendChild(b);
    });
  }
  var langBtns = document.querySelectorAll('[data-lang]');
  for (var li=0; li<langBtns.length; li++) {
    langBtns[li].onclick = function(){ lang=this.getAttribute('data-lang'); LS.set('hr_lang',lang); buildDepts(); show('pDept'); };
  }
  document.getElementById('backLang').onclick = function(){ show('pLang'); };
  document.getElementById('changeDept').onclick = function(){
    var p = phase();
    if (p==='countdown' || p==='running') { flash(t('locked')); return; }
    buildDepts(); show('pDept');
  };

  // ---------------- game state ----------------
  var game = null;
  var saved = {}; try { saved = JSON.parse(LS.get('hr_progress')||'{}') || {}; } catch(e){}
  var myRound = saved.round || null, myDept = saved.dept || null;
  var count = saved.count || 0, sent = saved.sent || 0;
  function saveProgress(){ LS.set('hr_progress', JSON.stringify({round:myRound, dept:myDept, count:count, sent:sent})); }

  function phase(){
    if (!game || !game.state || game.state==='waiting') return 'waiting';
    if (game.round !== myRound && game.state==='ended') return 'over';
    if (game.state==='running') {
      var now = serverNow();
      if (now < game.startAt) return 'countdown';
      if (now < game.endsAt) return 'running';
      return 'ended';
    }
    return 'ended';
  }
  function adoptRound(){
    if (game && game.round && game.round !== myRound && game.state === 'running') {
      myRound = game.round; myDept = deptId; count = 0; sent = 0; saveProgress();
    }
    if (game && game.state === 'running' && game.round === myRound && myDept !== deptId) {
      // department switched before the race started: start fresh for the new department
      if (count === 0) { myDept = deptId; saveProgress(); }
    }
  }

  var netBad = false;
  function setNet(ok){ netBad = !ok; document.getElementById('net').classList.toggle('bad', !ok); }

  function poll(){
    return backend.getGame().then(function(g){ game = g; adoptRound(); setNet(true); })
      .catch(function(){ setNet(false); });
  }
  function flush(){
    if (count <= sent || !myRound || !myDept) return Promise.resolve();
    var c = count;
    var t0 = Date.now();
    return backend.putClicks(myRound, myDept, c).then(function(res){
      sent = Math.max(sent, c); saveProgress(); setNet(true);
      if (res && typeof res.t === 'number') { offset = res.t - (t0 + Date.now())/2; }
    }).catch(function(e){
      if (e && (e.status===401 || e.status===403)) { return poll(); } // round reset / locked by server
      setNet(false);
    });
  }

  // main loop — phones send at most 1 request every 2 seconds
  var tick = 0, playing = false;
  function loop(){
    if (!playing) return;
    tick++;
    var p = phase(), job, wait;
    if (p === 'running') {
      job = (count > sent) ? flush() : (tick % 2 === 0 ? poll() : Promise.resolve());
      wait = 2000; // one request every 2 seconds per phone
    } else if (p === 'ended' && count > sent && game && serverNow() < game.endsAt + 4500) {
      job = flush(); wait = 600; // final batch inside the server grace window
    } else if (p === 'countdown') {
      job = (tick % 2 === 0) ? poll() : Promise.resolve(); wait = 1000;
    } else {
      job = poll(); wait = (p === 'waiting') ? 1500 : 3000;
    }
    job.then(function(){ setTimeout(loop, wait + Math.random()*400 - 200); });
  }

  // ---------------- tapping ----------------
  var recent = [];
  var tapBtn = document.getElementById('tap');
  function onTap(ev){
    ev.preventDefault();
    if (phase() !== 'running') return;
    var now = performance.now();
    while (recent.length && now - recent[0] > 1000) recent.shift();
    if (recent.length >= CFG.maxTapsPerSec) { flash(t('tooFast')); return; }
    recent.push(now);
    count++; saveProgress();
    tapBtn.classList.add('hit');
    setTimeout(function(){ tapBtn.classList.remove('hit'); }, 60);
    document.getElementById('tapCnt').textContent = count;
  }
  tapBtn.addEventListener('pointerdown', onTap);
  tapBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

  var warnTimer;
  function flash(msg){
    var w = document.getElementById('warn'); w.textContent = msg; w.classList.add('show');
    clearTimeout(warnTimer); warnTimer = setTimeout(function(){ w.classList.remove('show'); }, 900);
  }

  // ---------------- render ----------------
  function render(){
    if (playing) {
      var p = phase(), d = deptById(deptId);
      var st = document.getElementById('status'), tm = document.getElementById('timer');
      var lbl = document.getElementById('tapLabel'), cnt = document.getElementById('tapCnt'), my = document.getElementById('mycount');
      var dis = true;
      if (p === 'waiting') {
        st.textContent = t('waiting'); tm.textContent = ''; lbl.textContent = t('waitingBtn'); cnt.textContent = ''; my.textContent = '';
      } else if (p === 'countdown') {
        st.textContent = t('getReady'); tm.textContent = Math.ceil((game.startAt - serverNow())/1000);
        lbl.textContent = t('getReady'); cnt.textContent = ''; my.textContent = '';
      } else if (p === 'running') {
        dis = false;
        st.textContent = t('timeLeft'); tm.textContent = Math.max(0, Math.ceil((game.endsAt - serverNow())/1000));
        lbl.textContent = t('tap'); cnt.textContent = count; my.textContent = t('youTapped',{n:count});
      } else if (p === 'over') {
        st.textContent = t('roundOver'); tm.textContent = ''; lbl.textContent = t('roundOver'); cnt.textContent = ''; my.textContent = '';
      } else {
        st.textContent = t('timeUp'); tm.textContent = '0';
        lbl.textContent = t('timeUp'); cnt.textContent = count; my.textContent = t('youTapped',{n:count}) + ' · ' + t('seeScreen');
      }
      tapBtn.classList.toggle('disabled', dis);
      if (netBad && p !== 'running') my.textContent = t('netBad');
      document.getElementById('myDept').textContent = deptName(d) + (myName ? ' · ' + myName : '');
      document.documentElement.style.setProperty('--dept', d ? d.color : '#ffd25e');
    }
    requestAnimationFrame(render);
  }

  var wakeLock = null;
  function keepAwake(){
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; }).catch(function(){}); } catch(e){}
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='visible' && playing) { keepAwake(); poll(); } });

  function enterPlay(){
    show('pPlay');
    keepAwake();
    if (!playing) { playing = true; syncClock().then(poll).then(loop); }
    else { poll(); }
  }

  // ---------------- boot ----------------
  if (lang && T[lang]) {
    buildDepts();
    if (deptId && deptById(deptId) && myName) enterPlay(); else show('pDept');
  } else { show('pLang'); }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
